name: Keep App Awake

on:
  schedule:
    # Every 15 minutes - Streamlit Community Cloud sleeps apps after a period
    # of no traffic, so this ping keeps AgriVision Pro from hibernating.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sSf --max-time 30 "https://agrivision-pro.streamlit.app/" > /dev/null \
            || echo "Ping failed (app may currently be asleep/waking up)"
